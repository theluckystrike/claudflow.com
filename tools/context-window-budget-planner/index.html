<div class="container">
  <header>
    <h1>🧠 Context Window Budget Planner</h1>
    <div class="subhead">Allocate tokens wisely — optimize cost & performance</div>
  </header>

  <div class="planner-grid">
    <!-- LEFT: Controls -->
    <div class="card">
      <h2><span>⚙️</span> Budget allocation</h2>
      <div class="model-selector" id="modelSelector">
        <button class="model-btn" data-tokens="4096">4K</button>
        <button class="model-btn" data-tokens="8192">8K</button>
        <button class="model-btn active" data-tokens="16384">16K</button>
        <button class="model-btn" data-tokens="32768">32K</button>
        <button class="model-btn" data-tokens="131072">128K</button>
        <button class="model-btn" data-tokens="204800">200K</button>
      </div>
      <div id="slidersContainer">
        <!-- 6 sliders generated by JS -->
      </div>

      <div class="preset-area">
        <span style="color:#94a3b8; font-size:0.85rem; width:100%; margin-bottom:0.2rem;">📌 Use case presets</span>
        <button class="preset-btn" data-preset="chatbot">💬 Chatbot</button>
        <button class="preset-btn" data-preset="rag">📚 RAG</button>
        <button class="preset-btn" data-preset="codegen">🧑‍💻 Code generation</button>
        <button class="preset-btn" data-preset="extraction">📊 Data extraction</button>
      </div>

      <div class="stats" id="statsPanel">
        <div class="stat-item"><span class="label">Total allocated</span><span class="value" id="totalAllocated">0</span></div>
        <div class="stat-item"><span class="label">Cost / req (full)</span><span class="value" id="costFull">$0.00</span></div>
        <div class="stat-item"><span class="label">Cost / req (trim)</span><span class="value green" id="costTrim">$0.00</span></div>
        <div class="stat-item"><span class="label">Savings</span><span class="value orange" id="savingsPct">0%</span></div>
      </div>
    </div>

    <!-- RIGHT: Chart -->
    <div class="card">
      <h2><span>📊</span> Allocation pie</h2>
      <div class="chart-wrapper">
        <canvas id="pieChart" width="300" height="300"></canvas>
      </div>
      <div style="margin-top: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; justify-content:center; font-size:0.8rem; color:#b9c7db;" id="legendContainer"></div>
    </div>
  </div>

</div>

<script>
  (function() {
    // ----- DATA -----
    const sectionKeys = ['systemPrompt', 'toolsFunctions', 'ragContext', 'conversationHistory', 'fewShotExamples', 'outputReservation'];
    const sectionLabels = {
      systemPrompt: 'System prompt',
      toolsFunctions: 'Tools/functions',
      ragContext: 'RAG context',
      conversationHistory: 'Conversation history',
      fewShotExamples: 'Few-shot examples',
      outputReservation: 'Output reservation'
    };
    const presetAllocations = {
      chatbot:       [15, 5, 10, 50, 10, 10],
      rag:           [10, 5, 50, 20, 5, 10],
      codegen:       [20, 10, 10, 25, 20, 15],
      extraction:    [25, 15, 30, 10, 10, 10]
    };
    // default 16K, balanced
    let currentModelTokens = 16384;
    let sliderValues = [20, 10, 20, 25, 10, 15]; // must sum <=100

    // DOM refs
    const slidersContainer = document.getElementById('slidersContainer');
    const pieCanvas = document.getElementById('pieChart');
    const ctx = pieCanvas.getContext('2d');
    const legendContainer = document.getElementById('legendContainer');
    const totalAllocatedSpan = document.getElementById('totalAllocated');
    const costFullSpan = document.getElementById('costFull');
    const costTrimSpan = document.getElementById('costTrim');
    const savingsPctSpan = document.getElementById('savingsPct');

    // ----- RENDER SLIDERS -----
    function renderSliders() {
      let html = '';
      for (let i = 0; i < sectionKeys.length; i++) {
        const key = sectionKeys[i];
        const label = sectionLabels[key];
        const val = sliderValues[i];
        const warnId = `warn_${key}`;
        html += `<div class="slider-group">
          <div class="slider-label">
            <span>${label}</span>
            <span><span id="val_${key}">${val}</span>%</span>
          </div>
          <input type="range" min="0" max="100" value="${val}" data-index="${i}" class="budget-slider" id="sl_${key}">
          <div class="warning-badge" id="${warnId}">⚠️ Over 50% of budget</div>
        </div>`;
      }
      slidersContainer.innerHTML = html;
      // attach events
      document.querySelectorAll('.budget-slider').forEach(slider => {
        slider.addEventListener('input', function() {
          const idx = parseInt(this.dataset.index);
          sliderValues[idx] = parseInt(this.value);
          document.getElementById(`val_${sectionKeys[idx]}`).textContent = this.value;
          updateWarnings();
          updateChartAndStats();
        });
      });
      updateWarnings();
    }

    // ----- WARNINGS -----
    function updateWarnings() {
      for (let i = 0; i < sectionKeys.length; i++) {
        const key = sectionKeys[i];
        const val = sliderValues[i];
        const warnEl = document.getElementById(`warn_${key}`);
        if (val > 50) {
          warnEl.classList.add('show');
        } else {
          warnEl.classList.remove('show');
        }
      }
    }

    // ----- CHART & STATS -----
    function updateChartAndStats() {
      const totalPct = sliderValues.reduce((a,b) => a+b, 0);
      const totalTokens = Math.round(currentModelTokens * (totalPct / 100));
      totalAllocatedSpan.textContent = totalTokens.toLocaleString() + ' tok';

      // cost: $0.01 per 1K tokens
      const fullCost = (currentModelTokens / 1000) * 0.01;
      const trimCost = (totalTokens / 1000) * 0.01;
      costFullSpan.textContent = `$${fullCost.toFixed(4)}`;
      costTrimSpan.textContent = `$${trimCost.toFixed(4)}`;
      let savingsPct = 0;
      if (fullCost > 0) {
        savingsPct = ((fullCost - trimCost) / fullCost) * 100;
      }
      savingsPctSpan.textContent = savingsPct.toFixed(1) + '%';

      // draw pie
      drawPieChart(sliderValues);
      // legend
      buildLegend(sliderValues);
    }

    // ----- PIE CHART (canvas) -----
    function drawPieChart(data) {
      const total = data.reduce((a,b) => a+b, 0) || 1;
      const width = pieCanvas.width;
      const height = pieCanvas.height;
      ctx.clearRect(0, 0, width, height);
      if (total === 0) {
        ctx.fillStyle = '#334155';
        ctx.font = '14px system-ui';
        ctx.fillText('No allocation', width/2-40, height/2);
        return;
      }

      const colors = ['#38bdf8', '#f472b6', '#a78bfa', '#34d399', '#fb923c', '#facc15'];
      const cx = width/2, cy = height/2, radius = Math.min(width, height)/2 - 10;
      let startAngle = -Math.PI/2;

      for (let i = 0; i < data.length; i++) {
        const sliceAngle = (data[i] / total) * 2 * Math.PI;
        if (sliceAngle === 0) continue;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, startAngle + sliceAngle);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        // subtle border
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.stroke();
        startAngle += sliceAngle;
      }
      // center hole (donut)
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.45, 0, 2*Math.PI);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.stroke();
      // text in center
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 16px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const totalPct = data.reduce((a,b) => a+b, 0);
      ctx.fillText(totalPct + '%', cx, cy-6);
      ctx.font = '10px system-ui';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('used', cx, cy+14);
    }

    function buildLegend(data) {
      const labels = ['System', 'Tools', 'RAG', 'History', 'Examples', 'Output'];
      const colors = ['#38bdf8', '#f472b6', '#a78bfa', '#34d399', '#fb923c', '#facc15'];
      let html = '';
      for (let i = 0; i < data.length; i++) {
        html += `<span><span style="display:inline-block;width:10px;height:10px;background:${colors[i]};border-radius:2px;margin-right:4px;"></span> ${labels[i]} ${data[i]}%</span>`;
      }
      legendContainer.innerHTML = html;
    }

    // ----- MODEL SELECTION -----
    function initModelButtons() {
      const buttons = document.querySelectorAll('.model-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', function() {
          buttons.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentModelTokens = parseInt(this.dataset.tokens);
          updateChartAndStats();
        });
      });
    }

    // ----- PRESETS -----
    function applyPreset(name) {
      const alloc = presetAllocations[name];
      if (!alloc) return;
      for (let i = 0; i < sliderValues.length; i++) {
        sliderValues[i] = alloc[i];
        // update slider UI
        const slider = document.getElementById(`sl_${sectionKeys[i]}`);
        if (slider) {
          slider.value = alloc[i];
          document.getElementById(`val_${sectionKeys[i]}`).textContent = alloc[i];
        }
      }
      updateWarnings();
      updateChartAndStats();
    }

    function initPresetButtons() {
      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const preset = this.dataset.preset;
          applyPreset(preset);
        });
      });
    }

    // ----- INIT -----
    renderSliders();
    initModelButtons();
    initPresetButtons();
    // set default active model (16K)
    document.querySelector('.model-btn[data-tokens="16384"]')?.classList.add('active');
    // initial chart
    updateChartAndStats();
    // apply default balanced? already set.
  })();
</script>
