    <meta property="og:title" content="Agent Loop Cost Calculator — Estimate Multi-Turn Agent">
    <meta property="og:description" content="Calculate total tokens, cumulative cost, and optimal iteration limit for multi-turn AI agent loops. Supports Claude Opus, Sonnet, Haiku, GPT-4...">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://claudflow.com/tools/agent-loop-cost-calculator">
</head>
<body>
<div class="container">
  <header>
    <h1>🔄 Agent Loop Cost Calculator</h1>
    <p>Multi-turn expense estimator · accumulating context</p>
  </header>

  <div class="card">
    <div class="grid-2">
      <div class="input-group">
        <label for="toolsPerLoop">🔧 Tools/actions per iteration</label>
        <input type="number" id="toolsPerLoop" min="1" max="50" value="3" step="1">
      </div>
      <div class="input-group">
        <label for="tokensPerTool">📝 Avg tokens per tool call (input+output)</label>
        <input type="number" id="tokensPerTool" min="10" max="50000" value="800" step="10">
      </div>
      <div class="input-group">
        <label for="loopIterations">🔁 Expected loop iterations (1–50)</label>
        <input type="number" id="loopIterations" min="1" max="50" value="10" step="1">
      </div>
      <div class="input-group">
        <label for="modelSelect">🧠 Model</label>
        <select id="modelSelect">
          <option value="opus" data-input="15" data-output="75">Claude Opus ($15/$75)</option>
          <option value="sonnet" data-input="3" data-output="15" selected>Claude Sonnet ($3/$15)</option>
          <option value="haiku" data-input="0.25" data-output="1.25">Claude Haiku ($0.25/$1.25)</option>
          <option value="gpt4" data-input="30" data-output="60">GPT-4 ($30/$60)</option>
          <option value="gpt4omini" data-input="0.15" data-output="0.6">GPT-4o-mini ($0.15/$0.6)</option>
        </select>
      </div>
      <div class="input-group">
        <label for="systemPrompt">📄 System prompt size (tokens)</label>
        <input type="number" id="systemPrompt" min="0" max="100000" value="500" step="10">
      </div>
    </div>

    <!-- aggregated stats -->
    <div class="stat-row" id="statsPanel">
      <div class="stat-item"><span class="label">Total tokens</span><div class="value" id="totalTokens">—</div></div>
      <div class="stat-item"><span class="label">Total cost (USD)</span><div class="value" id="totalCost">—</div></div>
      <div class="stat-item"><span class="label">Cost / iteration</span><div class="value" id="costPerIteration">—</div></div>
      <div class="stat-item"><span class="label">Optimal iteration limit</span><div class="value" id="optimalLimit">—</div></div>
    </div>

    <!-- chart -->
    <div class="chart-wrapper">
      <canvas id="costChart"></canvas>
    </div>
    <p style="font-size:0.7rem; color:#64748b; margin-top:0.5rem; text-align:center;">Cumulative cost per iteration (USD, log scale if wide range)</p>
  </div>

  <div class="footer">
    © 2025 claudflow.com
  </div>
</div>

<script>
  (function() {
    // ----- DOM refs -----
    const toolsPerLoop = document.getElementById('toolsPerLoop');
    const tokensPerTool = document.getElementById('tokensPerTool');
    const loopIterations = document.getElementById('loopIterations');
    const modelSelect = document.getElementById('modelSelect');
    const systemPrompt = document.getElementById('systemPrompt');

    const totalTokensEl = document.getElementById('totalTokens');
    const totalCostEl = document.getElementById('totalCost');
    const costPerIterationEl = document.getElementById('costPerIteration');
    const optimalLimitEl = document.getElementById('optimalLimit');

    // chart
    const ctx = document.getElementById('costChart').getContext('2d');
    let chart;

    // ----- helpers -----
    function getModelPrices() {
      const opt = modelSelect.options[modelSelect.selectedIndex];
      return {
        inputPrice: parseFloat(opt.dataset.input) || 0,
        outputPrice: parseFloat(opt.dataset.output) || 0,
        name: opt.text.split('(')[0].trim()
      };
    }

    function calc() {
      const tools = parseInt(toolsPerLoop.value, 10) || 1;
      const tokPerTool = parseInt(tokensPerTool.value, 10) || 100;
      const iterations = parseInt(loopIterations.value, 10) || 1;
      const sysTokens = parseInt(systemPrompt.value, 10) || 0;
      const { inputPrice, outputPrice } = getModelPrices();

      // Clamp iterations 1-50
      const n = Math.min(50, Math.max(1, iterations));

      // Simulate accumulating context:
      // iteration i (1-indexed): system prompt + (i * tools * tokPerTool)  (accumulated tool calls)
      // We assume each iteration adds tools*tokPerTool new tokens (both input & output)
      // For cost: we treat total tokens as input tokens (since context is sent each turn)
      // but also output tokens per iteration = tools * tokPerTool * 0.4 (approx output fraction)
      // Realistic: input = system + accumulated history, output = tools * tokPerTool * outputRatio
      const outputRatio = 0.4; // 40% of tool tokens are output (generated)
      const inputRatio = 0.6;  // 60% input (prompt)

      let cumulativeTokens = 0;
      let cumulativeCost = 0;
      let perIterCosts = [];
      let iterTokens = [];

      for (let i = 1; i <= n; i++) {
        // accumulated context before this iteration: system + (i-1)*tools*tokPerTool (previous turns)
        const prevContextTokens = sysTokens + (i - 1) * tools * tokPerTool;
        // new input for this turn: previous context + new tool calls (input portion)
        const newInputTokens = prevContextTokens + tools * tokPerTool * inputRatio;
        // output tokens for this turn
        const newOutputTokens = tools * tokPerTool * outputRatio;
        const totalThisIter = newInputTokens + newOutputTokens;

        // cost: input tokens * inputPrice/1M + output tokens * outputPrice/1M
        const iterCost = (newInputTokens * inputPrice / 1_000_000) + (newOutputTokens * outputPrice / 1_000_000);
        cumulativeTokens += totalThisIter;
        cumulativeCost += iterCost;
        perIterCosts.push(iterCost);
        iterTokens.push(totalThisIter);
      }

      // total tokens (all iterations)
      const totalTok = cumulativeTokens;
      const totalCost = cumulativeCost;

      // cost per iteration (average)
      const avgCost = totalCost / n;

      // ---- optimal iteration limit: where marginal cost / avg cost > 0.2 (degradation) ----
      let optimalLimit = n;
      if (n > 1) {
        // compute marginal cost per additional iteration (starting from iteration 2)
        for (let i = 1; i < n; i++) {
          const marginal = perIterCosts[i] - perIterCosts[i-1];
          // if marginal > 20% of total cost so far (cumulative up to i)
          const cumSoFar = perIterCosts.slice(0, i+1).reduce((a,b)=>a+b, 0);
          if (marginal > 0.2 * cumSoFar && i >= 2) {
            optimalLimit = i; // degradation point
            break;
          }
        }
      }

      // ---- update DOM ----
      totalTokensEl.textContent = totalTok.toLocaleString('en-US', {maximumFractionDigits:0});
      totalCostEl.textContent = `$${totalCost.toFixed(4)}`;
      costPerIterationEl.textContent = `$${avgCost.toFixed(4)}`;
      optimalLimitEl.textContent = optimalLimit;

      // ---- update chart (cumulative cost) ----
      let cumulativeArr = [];
      let sum = 0;
      for (let i = 0; i < n; i++) {
        sum += perIterCosts[i];
        cumulativeArr.push(sum);
      }

      if (chart) {
        chart.data.labels = Array.from({length: n}, (_, i) => `#${i+1}`);
        chart.data.datasets[0].data = cumulativeArr;
        chart.update();
      } else {
        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: Array.from({length: n}, (_, i) => `#${i+1}`),
            datasets: [{
              label: 'Cumulative cost (USD)',
              data: cumulativeArr,
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56, 189, 248, 0.1)',
              fill: true,
              tension: 0.2,
              pointBackgroundColor: '#38bdf8',
              pointRadius: 3,
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) => `$${ctx.parsed.y.toFixed(4)}`
                }
              }
            },
            scales: {
              x: {
                ticks: { color: '#94a3b8', maxTicksLimit: 15 },
                grid: { color: '#1e293b' }
              },
              y: {
                ticks: { color: '#94a3b8', callback: (val) => '$' + val.toFixed(2) },
                grid: { color: '#1e293b' }
              }
            }
          }
        });
      }
    }

    // ----- input event listeners -----
    const inputs = [toolsPerLoop, tokensPerTool, loopIterations, modelSelect, systemPrompt];
    inputs.forEach(el => el.addEventListener('input', calc));
    inputs.forEach(el => el.addEventListener('change', calc));

    // initial calculation
    calc();

    // fix for select change
    modelSelect.addEventListener('change', calc);

  })();
</script>
</body>
</html>
